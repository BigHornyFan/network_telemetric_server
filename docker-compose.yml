version: '3.8'

services:
  # 1. База данных PostgreSQL с расширением TimescaleDB
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: telemetry_db
    environment:
      POSTGRES_USER: telemetry_user
      POSTGRES_PASSWORD: telemetry_pass
      POSTGRES_DB: telemetry_db
    ports:
      - "5432:5432" # Пробрасываем порт, чтобы можно было подключиться с хоста (через DBeaver)
    volumes:
      - pgdata:/var/lib/postgresql/data # Чтобы данные не пропадали при перезапуске
    restart: unless-stopped

  # 2. Брокер сообщений Kafka (в режиме KRaft, без Zookeeper)
  kafka:
    image: bitnami/kafka:latest
    container_name: telemetry_kafka
    ports:
      - "9092:9092" # Порт для подключения извне (с нашего C++ кода)
    environment:
      # Настройки для работы в режиме KRaft (без Zookeeper)
      - KAFKA_CFG_NODE_ID=0
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      # Отключаем автоматическое создание топиков (лучше создавать вручную)
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=false
    volumes:
      - kafkadata:/bitnami/kafka
    restart: unless-stopped

  # 3. Инструмент для просмотра Kafka (веб-интерфейс)
  # Намного удобнее смотреть сообщения в браузере, чем через консоль
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: telemetry_kafka_ui
    ports:
      - "8080:8080"
    environment:
      - KAFKA_CLUSTERS_0_NAME=local
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:9092
    depends_on:
      - kafka

# Определяем именованные тома, чтобы данные сохранялись между перезапусками
volumes:
  pgdata:
  kafkadata: